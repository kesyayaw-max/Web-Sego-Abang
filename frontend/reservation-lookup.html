<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cek Reservasi — RM Sego Abang</title>
<style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:20px;background:#f6f6f6}.card{background:#fff;padding:20px;border-radius:14px;box-shadow:0 2px 10px #0001;margin-bottom:16px}input,button{padding:12px;border-radius:9px;border:1px solid #ddd;width:100%;box-sizing:border-box;margin:6px 0}button{cursor:pointer}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eee;margin:3px}</style>
  <link rel="stylesheet" href="assets/phase75-ui.css">
</head><body><header class="brandbar"><img src="assets/pendopo-wonomarto-logo.png" alt="Logo Pendopo Wonomarto"><div><strong>RM. Sego Abang</strong><small>Pendopo Wonomarto</small></div></header><h1>🔎 Cek Reservasi</h1><div class="card"><input id="token" placeholder="Token akses reservasi"><input id="phone" placeholder="Nomor WhatsApp"><button onclick="lookup()">Cek Reservasi</button><div id="msg"></div></div><div id="result"></div>
<script>
async function lookup(){msg.textContent='Mencari...';result.innerHTML='';const r=await fetch('/api/customer/reservation-lookup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lookup_token:token.value,phone:phone.value})});const d=await r.json();if(!r.ok){msg.textContent=d.error||'Gagal';return}msg.textContent='';result.innerHTML=`<div class="card"><h2>${d.customer_name||'Reservasi'}</h2><p>Status: <b>${d.status}</b></p><p>Waktu: ${d.reservation_at||'-'}</p><p>Tamu: ${d.guest_count||'-'}</p><p>Meja: ${d.table_number ? 'Meja '+d.table_number : 'Menunggu konfirmasi'}</p><h3>Pre-order</h3>${d.items.map(x=>`<div class="pill">${x.quantity}x ${x.name}</div>`).join('')||'<p>Tidak ada pre-order.</p>'}<button onclick="cancelReservation('${d.id}')">Batalkan Reservasi</button></div>`}
async function cancelReservation(id){if(!confirm('Batalkan reservasi ini?'))return;const r=await fetch('/api/customer/reservation/'+id+'/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:phone.value,lookup_token:token.value})});const d=await r.json();alert(d.error||'Reservasi dibatalkan');lookup()}
</script></body></html>
