<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pembayaran Reservasi — RM. Sego Abang</title><style>body{margin:0;background:#1b1410;color:#f8f0df;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:1rem}.card{width:min(520px,100%);background:#211815;border:1px solid #3a2e26;border-radius:20px;padding:1.5rem;text-align:center}.muted{color:#a9977b}.price{font-size:1.5rem;color:#e2bb72;font-weight:800}.qr{max-width:280px;width:100%;background:#fff;padding:10px;border-radius:12px}.btn{display:inline-block;margin-top:1rem;padding:.7rem 1rem;border-radius:10px;background:#2c221c;color:#f8f0df;text-decoration:none}</style>  <link rel="stylesheet" href="assets/phase75-ui.css">
</head><body><main class="card"><div style="display:flex;justify-content:center;margin-bottom:10px"><img src="assets/pendopo-wonomarto-logo.png" alt="Logo Pendopo Wonomarto" style="width:120px;height:72px;object-fit:contain"></div><h1>💳 Pembayaran QRIS</h1><p id="code" class="muted">Memuat...</p><div id="out"></div><a class="btn" href="reservation-status.html">← Kembali</a></main><script>const p=new URLSearchParams(location.search),code=p.get('code'),token=p.get('token'),out=document.getElementById('out');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){if(!code||!token){out.innerHTML='<p class="muted">Link pembayaran tidak lengkap.</p>';return}try{const r=await fetch('/api/payments/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({booking_code:code,token,idempotency_key:'WEB-'+code})});const d=await r.json();if(!r.ok)throw Error(d.message);const x=d.payment||{};document.getElementById('code').textContent=code;if(d.paid||x.status==='VERIFIED'){out.innerHTML='<p class="price">Pembayaran sudah diterima ✓</p>';return}out.innerHTML=`<div class="price">Rp ${Number(x.locked_amount||x.amount||0).toLocaleString('id-ID')}</div><p class="muted">Nominal dikunci server. Jangan ubah nominal saat membayar.</p>${x.qr_image_url?`<img class="qr" src="${esc(x.qr_image_url)}" alt="QRIS">`:x.qr_payload?`<p style="word-break:break-all">${esc(x.qr_payload)}</p>`:'<p class="muted">Provider belum mengembalikan QR. Silakan gunakan kasir.</p>'}<p class="muted">Status pembayaran diperbarui otomatis setelah webhook provider.</p>`}catch(e){out.innerHTML='<p class="muted">'+esc(e.message)+'</p>'}}load();setInterval(load,10000);</script></body></html>
