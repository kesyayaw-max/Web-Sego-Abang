<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/x-icon" href="favicon.ico" />
<meta name="robots" content="noindex, nofollow" />
<title>Login Staf — RM. Sego Abang Pendopo Wonomarto</title>
<meta name="description" content="Portal login staf RM. Sego Abang Pendopo Wonomarto — sistem reservasi meja & operasional dapur." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --wood-950: #1B1410;
    --wood-900: #211815;
    --wood-800: #2C221C;
    --wood-700: #3A2E26;
    --wood-600: #4A3B31;
    --cream-100: #F4EDE0;
    --cream-200: #EDE3D3;
    --cream-300: #DCCDB2;
    --clay-400: #C1503F;
    --clay-500: #A63A2E;
    --clay-600: #8A2E24;
    --brass-300: #E0B968;
    --brass-400: #C9973E;
    --brass-500: #B07F2E;
    --sage-400: #7FA678;
    --sage-500: #5B8C5A;
    --turmeric-400: #E8B84B;
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--wood-950);
    color: var(--cream-200);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* Background decorative circles */
  body::before {
    content: '';
    position: fixed;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(176,127,46,0.08) 0%, transparent 70%);
    top: -200px; right: -200px;
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(166,58,46,0.06) 0%, transparent 70%);
    bottom: -150px; left: -100px;
    pointer-events: none;
  }

  /* Batik pattern overlay */
  .batik-bg {
    position: fixed; inset: 0;
    background-image:
      repeating-linear-gradient(45deg, rgba(176,127,46,0.03) 0 1px, transparent 1px 20px),
      repeating-linear-gradient(-45deg, rgba(176,127,46,0.03) 0 1px, transparent 1px 20px);
    pointer-events: none;
  }

  .login-card {
    position: relative;
    width: 100%;
    max-width: 420px;
    margin: 1rem;
    background: var(--wood-900);
    border: 1px solid var(--wood-700);
    border-radius: 24px;
    padding: 2.5rem;
    box-shadow:
      0 0 0 1px rgba(176,127,46,0.1),
      0 20px 60px rgba(0,0,0,0.5),
      0 4px 16px rgba(0,0,0,0.3);
  }

  /* Garis emas di atas card */
  .login-card::before {
    content: '';
    position: absolute;
    top: 0; left: 2rem; right: 2rem;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--brass-400), transparent);
    border-radius: 0 0 4px 4px;
  }

  .logo-area {
    text-align: center;
    margin-bottom: 2rem;
  }
  .logo-icon {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, var(--clay-500), var(--clay-600));
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1rem;
    font-size: 1.75rem;
    box-shadow: 0 4px 16px rgba(166,58,46,0.35);
  }
  .logo-title {
    font-family: 'Fraunces', serif;
    font-size: 1.5rem;
    color: var(--cream-100);
    letter-spacing: 0.02em;
  }
  .logo-subtitle {
    font-size: 0.75rem;
    color: var(--brass-400);
    text-transform: uppercase;
    letter-spacing: 0.18em;
    margin-top: 0.25rem;
  }

  .form-group {
    margin-bottom: 1.25rem;
  }
  label {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--cream-300);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 0.5rem;
  }

  .input-wrapper {
    position: relative;
  }
  .input-icon {
    position: absolute;
    left: 0.875rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--wood-600);
    font-size: 1rem;
    pointer-events: none;
    transition: color 0.2s;
  }
  input:focus ~ .input-icon,
  .input-wrapper:focus-within .input-icon { color: var(--brass-400); }

  input[type="email"],
  input[type="password"] {
    width: 100%;
    background: var(--wood-800);
    border: 1.5px solid var(--wood-700);
    border-radius: 10px;
    color: var(--cream-100);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.9rem;
    padding: 0.75rem 2.75rem 0.75rem 2.75rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input[type="email"]::placeholder,
  input[type="password"]::placeholder { color: var(--wood-600); }

  input:focus {
    border-color: var(--brass-400);
    box-shadow: 0 0 0 3px rgba(201,151,62,0.15);
  }

  input.error-input {
    border-color: var(--clay-500);
    box-shadow: 0 0 0 3px rgba(166,58,46,0.15);
  }

  .toggle-password {
    position: absolute;
    right: 0.875rem;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--wood-600);
    cursor: pointer;
    padding: 0.25rem;
    font-size: 0.9rem;
    transition: color 0.2s;
  }
  .toggle-password:hover { color: var(--cream-300); }

  .error-msg {
    display: flex;
    align-items: center;
    gap: 0.375rem;
    font-size: 0.78rem;
    color: var(--clay-400);
    margin-top: 0.5rem;
    min-height: 1rem;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 0.2s, transform 0.2s;
  }
  .error-msg.visible { opacity: 1; transform: translateY(0); }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  .shake { animation: shake 0.4s ease; }

  .btn-login {
    width: 100%;
    background: linear-gradient(135deg, var(--clay-500), var(--clay-600));
    color: var(--cream-100);
    border: none;
    border-radius: 10px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 0.875rem;
    cursor: pointer;
    margin-top: 0.5rem;
    transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 4px 12px rgba(166,58,46,0.35);
    position: relative;
    overflow: hidden;
  }
  .btn-login::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.07), transparent);
  }
  .btn-login:hover:not(:disabled) {
    opacity: 0.92;
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(166,58,46,0.45);
  }
  .btn-login:active:not(:disabled) { transform: translateY(0); }
  .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

  .btn-login .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(244,237,224,0.3);
    border-top-color: var(--cream-100);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 0.5rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .alert-box {
    border-radius: 10px;
    padding: 0.75rem 1rem;
    font-size: 0.85rem;
    margin-bottom: 1.25rem;
    display: flex;
    align-items: flex-start;
    gap: 0.5rem;
    opacity: 0;
    transform: translateY(-8px);
    transition: opacity 0.3s, transform 0.3s;
  }
  .alert-box.visible { opacity: 1; transform: translateY(0); }
  .alert-error {
    background: rgba(166,58,46,0.12);
    border: 1px solid rgba(166,58,46,0.4);
    color: #e07a6c;
  }
  .alert-success {
    background: rgba(91,140,90,0.12);
    border: 1px solid rgba(91,140,90,0.4);
    color: #7ec47d;
  }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--wood-700), transparent);
    margin: 1.5rem 0;
  }

  .hint {
    text-align: center;
    font-size: 0.75rem;
    color: rgba(220,205,178,0.45);
    line-height: 1.6;
  }
  .hint strong { color: rgba(220,205,178,0.7); }

  /* Floating particles */
  .particle {
    position: fixed;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: rgba(224,185,104,0.3);
    pointer-events: none;
    animation: float linear infinite;
  }
  @keyframes float {
    from { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    to { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--wood-600); border-radius: 6px; }
</style>
</head>
<body>

<div class="batik-bg"></div>

<div class="login-card" id="loginCard">
  <div class="logo-area">
    <div class="logo-icon">🍚</div>
    <h1 class="logo-title">Sego Abang</h1>
    <p style="font-size:0.75rem;color:rgba(220,205,178,0.6);margin-top:-0.25rem;margin-bottom:0.25rem;letter-spacing:0.08em;text-transform:uppercase;">Pendopo Wonomarto</p>
    <p class="logo-subtitle">Portal Staf Operasional</p>
  </div>

  <div class="alert-box alert-error" id="alertBox" role="alert">
    <span>⚠️</span>
    <span id="alertMsg"></span>
  </div>

  <form id="loginForm" novalidate autocomplete="off">
    <div class="form-group">
      <label for="email">Alamat Email</label>
      <div class="input-wrapper">
        <span class="input-icon">✉️</span>
        <input
          type="email"
          id="email"
          placeholder="nama@segoabang.id"
          required
          autocomplete="email"
        />
      </div>
      <p class="error-msg" id="emailErr">⚠️ <span></span></p>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <div class="input-wrapper">
        <span class="input-icon">🔒</span>
        <input
          type="password"
          id="password"
          placeholder="Masukkan password"
          required
          autocomplete="current-password"
        />
        <button type="button" class="toggle-password" id="togglePwd" title="Tampilkan/sembunyikan password">
          👁️
        </button>
      </div>
      <p class="error-msg" id="passErr">⚠️ <span></span></p>
    </div>

    <button type="submit" class="btn-login" id="loginBtn">
      Masuk ke Dashboard
    </button>
  </form>

  <div class="divider"></div>
  <p class="hint">
    Akun staf dibuat oleh <strong>Owner</strong>.<br>
    Hubungi Owner jika belum memiliki akses.
  </p>
</div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────
const API_BASE = '/api';

// Jika sudah login, langsung redirect ke dashboard
const token = localStorage.getItem('sga_token');
if (token) {
  // Verifikasi token masih valid
  fetch(`${API_BASE}/auth/me`, {
    headers: { Authorization: `Bearer ${token}` }
  }).then(r => {
    if (r.ok) window.location.href = 'admin-dashboard.html';
  }).catch(() => {});
}

// ─── FLOATING PARTICLES ───────────────────────────────────────────────
for (let i = 0; i < 12; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.cssText = `
    left: ${Math.random() * 100}%;
    width: ${2 + Math.random() * 4}px;
    height: ${2 + Math.random() * 4}px;
    animation-duration: ${8 + Math.random() * 14}s;
    animation-delay: ${-Math.random() * 12}s;
    opacity: ${0.2 + Math.random() * 0.4};
  `;
  document.body.appendChild(p);
}

// ─── DOM REFS ─────────────────────────────────────────────────────────
const form      = document.getElementById('loginForm');
const emailEl   = document.getElementById('email');
const passEl    = document.getElementById('password');
const loginBtn  = document.getElementById('loginBtn');
const togglePwd = document.getElementById('togglePwd');
const alertBox  = document.getElementById('alertBox');
const alertMsg  = document.getElementById('alertMsg');
const emailErr  = document.getElementById('emailErr');
const passErr   = document.getElementById('passErr');

// ─── TOGGLE PASSWORD ──────────────────────────────────────────────────
togglePwd.addEventListener('click', () => {
  if (passEl.type === 'password') {
    passEl.type = 'text';
    togglePwd.textContent = '🙈';
  } else {
    passEl.type = 'password';
    togglePwd.textContent = '👁️';
  }
});

// ─── INLINE VALIDATION ────────────────────────────────────────────────
function showFieldError(el, errEl, msg) {
  el.classList.add('error-input');
  errEl.querySelector('span').textContent = msg;
  errEl.classList.add('visible');
}
function clearFieldError(el, errEl) {
  el.classList.remove('error-input');
  errEl.classList.remove('visible');
}

emailEl.addEventListener('input', () => clearFieldError(emailEl, emailErr));
passEl.addEventListener('input', () => clearFieldError(passEl, passErr));

// ─── ALERT BOX ────────────────────────────────────────────────────────
function showAlert(msg, type = 'error') {
  alertBox.className = `alert-box alert-${type}`;
  alertBox.querySelector('span:first-child').textContent = type === 'error' ? '⚠️' : '✅';
  alertMsg.textContent = msg;
  alertBox.classList.add('visible');
}
function hideAlert() {
  alertBox.classList.remove('visible');
}

// ─── SET LOADING ──────────────────────────────────────────────────────
function setLoading(loading) {
  loginBtn.disabled = loading;
  loginBtn.innerHTML = loading
    ? '<span class="spinner"></span>Sedang masuk...'
    : 'Masuk ke Dashboard';
}

// ─── FORM SUBMIT ──────────────────────────────────────────────────────
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  hideAlert();

  const email = emailEl.value.trim();
  const password = passEl.value;

  // Validasi frontend sederhana
  let valid = true;
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showFieldError(emailEl, emailErr, 'Format email tidak valid.');
    valid = false;
  }
  if (!password || password.length < 6) {
    showFieldError(passEl, passErr, 'Password minimal 6 karakter.');
    valid = false;
  }
  if (!valid) {
    document.getElementById('loginCard').classList.remove('shake');
    void document.getElementById('loginCard').offsetWidth;
    document.getElementById('loginCard').classList.add('shake');
    return;
  }

  setLoading(true);

  try {
    const res = await fetch(`${API_BASE}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });

    const data = await res.json();

    if (!res.ok) {
      const msg = data.message || 'Login gagal. Periksa kembali email dan password.';
      showAlert(msg, 'error');
      document.getElementById('loginCard').classList.remove('shake');
      void document.getElementById('loginCard').offsetWidth;
      document.getElementById('loginCard').classList.add('shake');
      return;
    }

    // Simpan token & data user ke localStorage
    localStorage.setItem('sga_token', data.token);
    localStorage.setItem('sga_user', JSON.stringify(data.user));

    showAlert(`Selamat datang, ${data.user.full_name}! Sedang memuat dashboard...`, 'success');

    setTimeout(() => {
      window.location.href = 'admin-dashboard.html';
    }, 900);

  } catch (err) {
    showAlert('Tidak dapat terhubung ke server. Pastikan backend sedang berjalan.', 'error');
    console.error('[LOGIN]', err);
  } finally {
    setLoading(false);
  }
});
</script>
</body>
</html>
