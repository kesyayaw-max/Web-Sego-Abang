<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operasional — RM Sego Abang</title>
<style>body{font-family:system-ui,sans-serif;margin:0;padding:20px;background:#f6f6f6}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#fff;padding:18px;border-radius:14px;box-shadow:0 2px 10px #0001}.status{display:inline-block;margin:4px;padding:5px 8px;background:#eee;border-radius:8px}.brandbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}.brandbar img{width:58px;height:42px;object-fit:contain}.brandbar strong{display:block;font-size:1rem}.brandbar small{display:block;color:#777;font-size:.72rem;margin-top:2px}</style>  <link rel="stylesheet" href="assets/phase75-ui.css">
</head>
<body><header class="brandbar"><img src="assets/pendopo-wonomarto-logo.png" alt="Logo Pendopo Wonomarto"><div><strong>RM. Sego Abang</strong><small>Pendopo Wonomarto</small></div></header><h1>📊 Operasional Hari Ini</h1><div class="cards"><div class="card"><small>Reservasi</small><h2 id="r">-</h2></div><div class="card"><small>Order</small><h2 id="o">-</h2></div><div class="card"><small>Menu Habis</small><h2 id="m">-</h2></div></div><h2>Status Meja</h2><div id="tables"></div><p><a href="/kitchen.html">Buka Kitchen Display →</a></p>
<script>const token=localStorage.getItem('sga_token');if(!token)location.href='/login.html';async function load(){const res=await fetch('/api/operations/today',{headers:{Authorization:'Bearer '+token}});if(res.status===401){localStorage.removeItem('sga_token');location.href='/login.html';return}const d=await res.json();r.textContent=d.reservations_today;o.textContent=d.orders_today;m.textContent=d.unavailable_menu_items;tables.innerHTML=(d.tables||[]).map(x=>`<span class="status">${x.status}: ${x.count}</span>`).join('')}load();setInterval(load,15000)</script></body></html>
