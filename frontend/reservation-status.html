<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Status Reservasi — RM. Sego Abang</title><link rel="icon" href="favicon.ico"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet"><style>
body{margin:0;background:#1b1410;color:#f8f0df;font-family:"Plus Jakarta Sans",sans-serif;min-height:100vh;display:grid;place-items:center;padding:1rem}.card{width:min(520px,100%);background:#211815;border:1px solid #3a2e26;border-radius:20px;padding:1.5rem;box-shadow:0 20px 60px #0006}h1{font:600 2rem Fraunces,serif;margin:.4rem 0 1rem}.ey{font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:#e2bb72;font-weight:700}.code{font:700 1.25rem ui-monospace,monospace;color:#e2bb72}.row{display:flex;justify-content:space-between;gap:1rem;border-bottom:1px solid #3a2e26;padding:.7rem 0;font-size:.8rem}.muted{color:#a9977b}.badge{display:inline-block;border-radius:20px;padding:.35rem .7rem;font-size:.7rem;font-weight:700;background:#c9973e18;color:#e2bb72}.btn{display:inline-flex;padding:.7rem 1rem;border-radius:10px;background:#2c221c;border:1px solid #3a2e26;color:#dccdb2;text-decoration:none;font-size:.8rem;font-weight:700;margin-top:1rem}
</style>  <link rel="stylesheet" href="assets/phase75-ui.css">
</head><body><main class="card"><div style="display:flex;justify-content:center;margin-bottom:10px"><img src="assets/pendopo-wonomarto-logo.png" alt="Logo Pendopo Wonomarto" style="width:120px;height:72px;object-fit:contain"></div><div class="ey">Status Reservasi</div><h1 id="title">Memuat...</h1><div id="content"></div><a class="btn" href="customer.html">← Buat Reservasi Baru</a></main><script>
const params=new URLSearchParams(location.search); const saved=JSON.parse(localStorage.getItem('reservation_access')||'null'); const code=params.get('code')||saved?.code; const token=params.get('token')||saved?.token; const content=document.getElementById('content');
async function load(){if(!code||!token){content.innerHTML='<p class="muted">Akses reservasi tidak lengkap. Silakan gunakan halaman Cek Status Reservasi.</p>';return}try{const r=await fetch('/api/reservations/'+encodeURIComponent(code)+'?token='+encodeURIComponent(token||''));const d=await r.json();if(!r.ok)throw Error(d.message);const x=d.reservation;document.getElementById('title').textContent=x.customer_name;content.innerHTML=`<p class="code">${x.reservation_code}</p><p><span class="badge">${x.status}</span></p><div class="row"><span class="muted">Waktu</span><b>${new Date(x.reservation_at).toLocaleString('id-ID',{dateStyle:'full',timeStyle:'short'})}</b></div><div class="row"><span class="muted">Tamu</span><b>${x.guest_count} orang</b></div><div class="row"><span class="muted">Meja</span><b>${x.table_number||'Diatur restoran'}</b></div>${x.booking && x.booking.public_token && x.booking.payment_status!=='PAID' ? `<a class="btn" href="reservation-pay.html?code=${encodeURIComponent(x.booking.booking_code)}&token=${encodeURIComponent(x.booking.public_token)}">💳 Bayar ${Number(x.booking.total_amount||0).toLocaleString('id-ID')}</a>` : x.booking && x.booking.payment_status==='PAID' ? '<p class="badge" style="margin-top:1rem">Pembayaran sudah diterima ✓</p>' : ''}`}catch(e){content.innerHTML='<p class="muted">'+e.message+'</p>'}}
load();setInterval(load,15000);
</script></body></html>
