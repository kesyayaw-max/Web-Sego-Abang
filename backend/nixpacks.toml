# nixpacks.toml
# Konfigurasi build Railway (Nixpacks) untuk backend RM. Sego Abang Pendopo Wonomarto.
# Railway menggunakan Nixpacks secara default untuk mendeteksi & membangun
# aplikasi Node.js. File ini memastikan versi Node yang benar dan perintah
# install yang tepat digunakan.

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm ci --omit=dev"]

[start]
cmd = "node server.js"
